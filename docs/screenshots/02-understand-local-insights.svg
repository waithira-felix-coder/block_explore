<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
      <rect width="1600" height="960" fill="#E6E1D6"/>
      <!-- Map background -->
      <g stroke="#D5CFC2" stroke-width="2">
        <line x1="0" y1="140" x2="1600" y2="280"/>
        <line x1="0" y1="360" x2="1600" y2="310"/>
        <line x1="420" y1="0" x2="660" y2="960"/>
        <line x1="940" y1="0" x2="990" y2="960"/>
      </g>
      <!-- Viewport Telemetry Strip -->
      <rect x="80" y="210" width="320" height="36" fill="#FBF9F5" stroke="#D6D3D1"/>
      <text x="98" y="233" font-family="monospace" font-size="12" fill="#1C1917">Viewport · 35.6580°, 139.7016° · Zoom 13.5</text>

      <!-- Local Insights Banner -->
      <rect x="80" y="260" width="1440" height="620" fill="#FBF9F5" stroke="#D6D3D1" stroke-width="2"/>
      <rect x="80" y="260" width="1440" height="54" fill="#F7F4EE" stroke="#D6D3D1"/>
      <text x="112" y="294" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1C1917">Local Insights · Shibuya, Tokyo</text>

      <!-- 3 Fun Facts -->
      <circle cx="120" cy="356" r="4" fill="#9A3412"/>
      <text x="138" y="361" font-family="sans-serif" font-size="16" fill="#1C1917">Shibuya Crossing scrambles up to 3,000 pedestrians per green light cycle across five synchronized intersections.</text>
      <circle cx="120" cy="406" r="4" fill="#9A3412"/>
      <text x="138" y="411" font-family="sans-serif" font-size="16" fill="#1C1917">Beneath the station plazas, the Shibuya River still flows through brick-lined subterranean culverts built ahead of 1964.</text>
      <circle cx="120" cy="456" r="4" fill="#9A3412"/>
      <text x="138" y="461" font-family="sans-serif" font-size="16" fill="#1C1917">Center-gai and Nonbei Yokocho preserve post-war lantern alleys housing tiny six-seat yakitori bars steps from neon towers.</text>

      <line x1="112" y1="500" x2="1488" y2="500" stroke="#E7E5E4"/>

      <!-- Quiz Action & Hyperlocal Toggle -->
      <rect x="112" y="524" width="250" height="40" fill="#1C1917"/>
      <text x="132" y="549" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FBF9F5" letter-spacing="1">TEST THEIR LOCAL KNOWLEDGE</text>

      <rect x="380" y="524" width="245" height="40" fill="#F7F4EE" stroke="#D6D3D1"/>
      <text x="402" y="549" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1C1917">Hyperlocal mode · STANDARD</text>
      <text x="1290" y="549" font-family="monospace" font-size="12" fill="#78716C">Google Maps · gemini-3.8-flash</text>

      <!-- Explainer Box -->
      <rect x="112" y="584" width="1376" height="84" fill="#F7F4EE" stroke="#E7E5E4"/>
      <text x="136" y="614" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1C1917">How Hyperlocal Mode Works (Increased Quiz Difficulty)</text>
      <text x="136" y="642" font-family="sans-serif" font-size="13" fill="#57534E">Enabling Hyperlocal mode connects Gemini to Google Maps Grounding Lite (search_places &amp; Maps Grounding) around the active coordinates.</text>

      <!-- Category Buttons -->
      <rect x="112" y="692" width="1376" height="150" fill="#F7F4EE" stroke="#D6D3D1"/>
      <text x="136" y="726" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1C1917">Select a category to generate a 3-question quiz about Shibuya, Tokyo:</text>

      <rect x="136" y="750" width="420" height="56" fill="#1C1917"/>
      <text x="164" y="784" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FBF9F5">Local cuisine</text>
      <circle cx="526" cy="778" r="5" fill="#C2410C"/>

      <rect x="580" y="750" width="420" height="56" fill="#FFFFFF" stroke="#D6D3D1"/>
      <text x="608" y="784" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1C1917">Art and culture</text>

      <rect x="1024" y="750" width="436" height="56" fill="#FFFFFF" stroke="#D6D3D1"/>
      <text x="1052" y="784" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1C1917">Local history</text>
    </svg>