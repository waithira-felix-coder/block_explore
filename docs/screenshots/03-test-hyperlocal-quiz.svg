      <!-- Question 1 -->
      <rect x="76" y="180" width="1448" height="190" fill="#FFFFFF" stroke="#D6D3D1"/>
      <text x="100" y="214" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1C1917">1. Which historic 1858 café on Avenida de Mayo 825 in Monserrat is famed for its marble tables and chocolate con churros?</text>
      <rect x="100" y="232" width="690" height="42" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
      <text x="124" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="#064E3B">● Café Tortoni</text>
      <rect x="810" y="232" width="690" height="42" fill="#FAFAF9" stroke="#E7E5E4"/>
      <text x="834" y="258" font-family="sans-serif" font-size="14" fill="#78716C">○ Las Violetas (Almagro)</text>
      <text x="100" y="310" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065F46">✓ Correct! Correct Answer: Café Tortoni</text>
      <text x="100" y="336" font-family="sans-serif" font-size="13" fill="#57534E">Founded in 1858 at Av. de Mayo 825, Café Tortoni is Buenos Aires’ oldest bar notable and literary gathering spot.</text>

      <!-- Question 2 -->
      <rect x="76" y="388" width="1448" height="190" fill="#FFFFFF" stroke="#D6D3D1"/>
      <text x="100" y="422" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1C1917">2. In San Telmo, which wrought-iron indoor market opened in 1897 along Defensa and Bolívar streets?</text>
      <rect x="100" y="440" width="690" height="42" fill="#ECFDF5" stroke="#047857" stroke-width="2"/>
      <text x="124" y="466" font-family="sans-serif" font-size="14" font-weight="bold" fill="#064E3B">● Mercado de San Telmo</text>
      <rect x="810" y="440" width="690" height="42" fill="#FAFAF9" stroke="#E7E5E4"/>
      <text x="834" y="466" font-family="sans-serif" font-size="14" fill="#78716C">○ Mercado del Progreso (Caballito)</text>
      <text x="100" y="518" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065F46">✓ Correct! Correct Answer: Mercado de San Telmo</text>
      <text x="100" y="544" font-family="sans-serif" font-size="13" fill="#57534E">Designed by engineer Juan Antonio Buschiazzo in 1897, Mercado de San Telmo anchors the historic neighborhood block.</text>

